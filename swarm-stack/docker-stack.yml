version: "3.8"

# ---------------------------------------------------------------------------
# NETWORK BOUNDARY MODEL (this is the core trust-boundary decision):
#
#   external client
#         |
#         v
#   [ edge-net ]  <-- only network with a published host port (80, 8081)
#         |
#      (traefik)
#         |
#   [ app-net ]   <-- overlay network, NO published ports for "app",
#         |            not reachable from outside the swarm at all
#      (app service, prometheus, grafana)
#
# The "app" service is attached ONLY to app-net. It has no published ports.
# The only way external clients reach it is through traefik, which is
# attached to BOTH networks and acts as the sole ingress point.
#
# Observability addition (Step 8):
#   - prometheus lives on app-net only, so it can scrape app:8080/metrics
#     and edge:8080/metrics directly over the internal overlay network -
#     no published port needed for prometheus itself.
#   - grafana needs a way for a human to view dashboards, so it publishes
#     port 3000 directly to the host. This is a deliberate, documented
#     shortcut for the local/demo environment (see README "known
#     shortcuts") - in production this should sit behind the edge
#     (Traefik) with auth, not a raw published port.
# ---------------------------------------------------------------------------

services:

  edge:
    image: traefik:v3.6
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"              # LOCAL DEMO ONLY: exposes the API/dashboard
                                            # without auth so you can debug via :8081/api/*
      - "--metrics.prometheus=true"        # Exposes Traefik's own metrics (incl. rate-limit
                                            # 429s) at :8080/metrics, scraped by prometheus
                                            # below over the internal app-net network.
      - "--accesslog=true"                 # request-level log for every hit at the edge
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--accesslog.fields.headers.names.X-Request-Id=keep"
      - "--log.level=INFO"
    ports:
      - target: 80
        published: 80
      - target: 8080          # Traefik dashboard/API/metrics - LOCAL DEMO ONLY.
        published: 8081       # In production this must not be publicly exposed;
                               # see design note "known gaps".
    networks:
      - edge-net
      - app-net              # needed so prometheus (on app-net) can reach edge:8080/metrics
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  app:
    image: txn-platform:dev
    environment:
      - SERVICE_VERSION=1.0.0
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      # - FAIL_HEALTH=true
      - FAIL_HEALTH=false
    secrets:
      - jwt_secret
    networks:
      - app-net              # NOTE: intentionally NOT on edge-net.
                              # No published ports either - unreachable
                              # from the host or the internet directly.
    deploy:
      replicas: 2
      placement:
        constraints: [node.role == manager]
        # NOTE: pinned to the manager because this demo intentionally
        # runs as a single-node Swarm and does not use a registry to
        # distribute the locally-built image to other nodes. In a real
        # multi-node deployment, the image would be pushed to a registry
        # (see the CI/CD stage) and this constraint would be removed.
      labels:
        # Traefik picks these up because it's scoped to app-net above.
        - "traefik.enable=true"
        - "traefik.http.routers.app.rule=PathPrefix(`/`)"
        - "traefik.http.routers.app.entrypoints=web"
        - "traefik.http.services.app.loadbalancer.server.port=8080"
        - "traefik.http.services.app.loadbalancer.healthcheck.path=/health"
        - "traefik.http.services.app.loadbalancer.healthcheck.interval=5s"
        # --- Rate limiting middleware (Step 4) ---
        # Average: 5 requests/sec sustained, Burst: up to 10 in a spike.
        # Requests beyond this get a 429 from Traefik before ever reaching
        # the app. JWT validation itself stays in the app (see README) -
        # this is just edge-level abuse protection, not auth.
        # - "traefik.http.middlewares.app-ratelimit.ratelimit.average=50"
        # - "traefik.http.middlewares.app-ratelimit.ratelimit.burst=100"
        - "traefik.http.middlewares.app-ratelimit.ratelimit.average=5"
        - "traefik.http.middlewares.app-ratelimit.ratelimit.burst=10"
        - "traefik.http.routers.app.middlewares=app-ratelimit"
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first          # start new task, wait til healthy, then stop old -> no downtime
        failure_action: rollback    # <-- Scenario 2: Swarm auto-rolls-back on failed update
        monitor: 15s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 30s
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  # ---------------------------------------------------------------------
  # Prometheus - scrapes app:8080/metrics AND edge:8080/metrics over the
  # internal app-net overlay network. No published port strictly needed;
  # port 9090 is published for local demo convenience so you can open the
  # UI directly (see README "known shortcuts").
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: alert_rules_config
        target: /etc/prometheus/alert_rules.yml
    networks:
      - app-net
    ports:
      - target: 9090
        published: 9090   # LOCAL DEMO ONLY - see design note "known gaps".
    deploy:
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  # ---------------------------------------------------------------------
  # Grafana - dashboard UI. Publishes port 3000 directly to the host so
  # a human can view it. KNOWN SHORTCUT: for this local demo it's a raw
  # published port with no auth hardening beyond Grafana's own login;
  # in production this should go through the edge (Traefik) with TLS
  # and proper access control. See README "known shortcuts".
  # ---------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
    secrets:
      - grafana_admin_password
    configs:
      - source: grafana_datasource_config
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboard_provider_config
        target: /etc/grafana/provisioning/dashboards/dashboard-provider.yml
      - source: grafana_dashboard_request_rate
        target: /var/lib/grafana/dashboards/request-rate-per-tenant.json
      - source: grafana_dashboard_error_rate
        target: /var/lib/grafana/dashboards/per-tenant-error-rate.json
      - source: grafana_dashboard_latency
        target: /var/lib/grafana/dashboards/p95-latency-per-tenant.json
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - app-net             # to reach prometheus internally
      - edge-net            # KNOWN SHORTCUT: could instead route through
                             # Traefik like "app" does; direct port used
                             # here to keep this step simple under time
                             # pressure. See README.
    ports:
      - target: 3000
        published: 3000
    deploy:
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

networks:
  edge-net:
    driver: overlay
  app-net:
    driver: overlay
    # No "attachable: true" and no published ports for "app" or
    # "prometheus" on this network -> those two are not reachable from
    # outside the swarm cluster. ("edge" and "grafana" are also on
    # edge-net so they can be reached directly, per the design above.)

volumes:
  grafana-data:
    driver: local

configs:
  prometheus_config:
    file: ./prometheus.yml
    # See prometheus.yml in this same directory. Docker configs (unlike
    # secrets) are plaintext, which is fine here - a scrape config isn't
    # sensitive.
  alert_rules_config:
    name: alert_rules_config_${TIMESTAMP:-v1}
    file: ./alert_rules.yml
    # See alert_rules.yml in this same directory.
  grafana_datasource_config:
    file: ./grafana/datasources.yml
  grafana_dashboard_provider_config:
    file: ./grafana/dashboard-provider.yml
  grafana_dashboard_request_rate:
    file: ./grafana/dashboards/request-rate-per-tenant.json
  grafana_dashboard_error_rate:
    file: ./grafana/dashboards/per-tenant-error-rate.json
  grafana_dashboard_latency:
    file: ./grafana/dashboards/p95-latency-per-tenant.json
    #
    # IMPORTANT: Docker configs are immutable, same as secrets. If you
    # edit any of prometheus.yml, alert_rules.yml, or the grafana/*
    # files after the first deploy, the safest path is:
    #   docker stack rm axiler && sleep 10
    #   ./deploy.sh
    # (docker stack rm auto-removes non-external configs defined here,
    # so no manual `docker config rm` is needed - see README.)

secrets:
  jwt_secret:
    external: true
    # Created ahead of time with:
    #   printf "devsecret123" | docker secret create jwt_secret -
    # See deploy.sh (creates this automatically if missing).
  grafana_admin_password:
    external: true
    # Created ahead of time with:
    #   printf "changeme123" | docker secret create grafana_admin_password -
    # See deploy.sh (creates this automatically if missing).
