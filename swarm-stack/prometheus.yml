global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "txn-platform-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]

  # Traefik's own metrics (requires --metrics.prometheus=true on the
  # edge service, see docker-stack.yml). This gives visibility into
  # edge-level signals that never reach the app - e.g. HTTP 429s
  # generated by the rate-limit middleware, which the app itself never
  # sees because Traefik rejects those requests before forwarding them.
  - job_name: "traefik-edge"
    metrics_path: /metrics
    static_configs:
      - targets: ["edge:8080"]
